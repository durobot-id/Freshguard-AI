<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="espBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="espPcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="metalShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#espBgGrad)"/>
  <rect x="20" y="20" width="760" height="460" rx="20" fill="none" stroke="#72D94C" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Technical Grid -->
  <path d="M 50 100 H 750 M 50 200 H 750 M 50 300 H 750 M 50 400 H 750" stroke="#72D94C" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 200 50 V 450 M 400 50 V 450 M 600 50 V 450" stroke="#72D94C" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Center-Left: ESP32-S3 DevKit Board -->
  <g transform="translate(100, 100)">
    <!-- Board Base -->
    <rect x="0" y="0" width="280" height="260" rx="14" fill="url(#espPcbGrad)" stroke="#38BDF8" stroke-width="2"/>

    <!-- Dual GPIO Headers (Top & Bottom) -->
    <g fill="#FBBF24">
      <!-- Top Row Pins -->
      <circle cx="20" cy="12" r="3.5"/><circle cx="36" cy="12" r="3.5"/><circle cx="52" cy="12" r="3.5"/>
      <circle cx="68" cy="12" r="3.5"/><circle cx="84" cy="12" r="3.5"/><circle cx="100" cy="12" r="3.5"/>
      <circle cx="116" cy="12" r="3.5"/><circle cx="132" cy="12" r="3.5"/><circle cx="148" cy="12" r="3.5"/>
      <circle cx="164" cy="12" r="3.5"/><circle cx="180" cy="12" r="3.5"/><circle cx="196" cy="12" r="3.5"/>
      <circle cx="212" cy="12" r="3.5"/><circle cx="228" cy="12" r="3.5"/><circle cx="244" cy="12" r="3.5"/>
      <circle cx="260" cy="12" r="3.5"/>

      <!-- Bottom Row Pins -->
      <circle cx="20" cy="248" r="3.5"/><circle cx="36" cy="248" r="3.5"/><circle cx="52" cy="248" r="3.5"/>
      <circle cx="68" cy="248" r="3.5"/><circle cx="84" cy="248" r="3.5"/><circle cx="100" cy="248" r="3.5"/>
      <circle cx="116" cy="248" r="3.5"/><circle cx="132" cy="248" r="3.5"/><circle cx="148" cy="248" r="3.5"/>
      <circle cx="164" cy="248" r="3.5"/><circle cx="180" cy="248" r="3.5"/><circle cx="196" cy="248" r="3.5"/>
      <circle cx="212" cy="248" r="3.5"/><circle cx="228" cy="248" r="3.5"/><circle cx="244" cy="248" r="3.5"/>
      <circle cx="260" cy="248" r="3.5"/>
    </g>

    <!-- Metal RF Shield CAN (ESP32-S3-WROOM) -->
    <rect x="40" y="50" width="130" height="150" rx="8" fill="url(#metalShieldGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- PCB Antenna Pattern (Copper Trace) -->
    <rect x="45" y="55" width="120" height="25" rx="3" fill="#B45309"/>
    <path d="M 50 67 H 70 V 73 H 90 V 67 H 110 V 73 H 130 V 67 H 155" fill="none" stroke="#FBBF24" stroke-width="2"/>

    <!-- Espressif & Model Logo on Shield -->
    <text x="105" y="115" fill="#FFFFFF" font-size="12" font-weight="900" font-family="sans-serif" text-anchor="middle">ESPRESSIF</text>
    <text x="105" y="135" fill="#38BDF8" font-size="14" font-weight="bold" font-family="monospace" text-anchor="middle">ESP32-S3</text>
    <text x="105" y="152" fill="#E2E8F0" font-size="9" font-family="sans-serif" text-anchor="middle">Wi-Fi &amp; BLE 5.0</text>
    <text x="105" y="170" fill="#94A3B8" font-size="8" font-family="monospace" text-anchor="middle">Xtensa Dual-Core</text>

    <!-- Dual Type-C USB Ports (Right Edge) -->
    <rect x="250" y="60" width="25" height="40" rx="4" fill="#94A3B8" stroke="#E2E8F0"/>
    <text x="235" y="85" fill="#94A3B8" font-size="7" font-family="sans-serif">USB</text>

    <rect x="250" y="155" width="25" height="40" rx="4" fill="#94A3B8" stroke="#E2E8F0"/>
    <text x="230" y="180" fill="#94A3B8" font-size="7" font-family="sans-serif">UART</text>

    <!-- Buttons & RGB LED -->
    <rect x="195" y="65" width="20" height="20" rx="3" fill="#334155"/>
    <circle cx="205" cy="75" r="5" fill="#E2E8F0"/>
    <text x="205" y="95" fill="#64748B" font-size="7" text-anchor="middle">BOOT</text>

    <rect x="195" y="165" width="20" height="20" rx="3" fill="#334155"/>
    <circle cx="205" cy="175" r="5" fill="#E2E8F0"/>
    <text x="205" y="195" fill="#64748B" font-size="7" text-anchor="middle">RST</text>

    <!-- RGB NeoPixel LED -->
    <rect x="195" y="118" width="18" height="18" rx="2" fill="#111" stroke="#444"/>
    <circle cx="204" cy="127" r="5" fill="#72D94C"/>
  </g>

  <!-- Right Details & System Flow -->
  <g transform="translate(420, 100)">
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="320" height="65" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#72D94C" font-size="13" font-weight="bold" font-family="sans-serif">Otak Komputasi FRESHGUARD AI</text>
      <text x="16" y="48" fill="#CBD5E1" font-size="11" font-family="sans-serif">Membaca sinyal ADC dari sensor pH dan VOC MS1100</text>
    </g>

    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="320" height="65" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#38BDF8" font-size="13" font-weight="bold" font-family="sans-serif">Pemrosesan AI Random Forest</text>
      <text x="16" y="48" fill="#CBD5E1" font-size="11" font-family="sans-serif">Klasifikasi otomatis kondisi Segar / Basi</text>
    </g>

    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="320" height="65" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#FBBF24" font-size="13" font-weight="bold" font-family="sans-serif">Sinkronisasi Cloud Firebase</text>
      <text x="16" y="48" fill="#CBD5E1" font-size="11" font-family="sans-serif">Pengiriman paket data real-time via koneksi Wi-Fi</text>
    </g>
  </g>

  <!-- Top Left Badge -->
  <rect x="45" y="45" width="340" height="42" rx="12" fill="#72D94C" fill-opacity="0.15" stroke="#72D94C" stroke-width="1.5"/>
  <text x="65" y="72" fill="#72D94C" font-size="16" font-weight="900" font-family="sans-serif">MIKROKONTROLER ESP32-S3</text>

  <!-- Footer Specs -->
  <rect x="45" y="415" width="710" height="45" rx="10" fill="#020617" stroke="#72D94C" stroke-opacity="0.3"/>
  <text x="65" y="442" fill="#EAF8E3" font-size="12" font-family="sans-serif">
    <tspan font-weight="bold" fill="#72D94C">Spesifikasi:</tspan> CPU: Xtensa 32-bit LX7 Dual-Core 240MHz | RAM: 512KB SRAM + PSRAM | Wi-Fi 802.11 b/g/n + BLE 5
  </text>
</svg>
