<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sulfurBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F0E"/>
      <stop offset="100%" stop-color="#140D05"/>
    </linearGradient>
    <linearGradient id="sulfurPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <radialGradient id="meshSulfur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <pattern id="sulfurGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#451A03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sulfurBg)"/>
  <rect x="20" y="20" width="760" height="460" rx="20" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Technical Grid -->
  <path d="M 50 100 H 750 M 50 200 H 750 M 50 300 H 750 M 50 400 H 750" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 200 50 V 450 M 400 50 V 450 M 600 50 V 450" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Left: Sensor Board (Sulfur / H2S Gas Sensor) -->
  <g transform="translate(100, 100)">
    <!-- Board Base -->
    <rect x="0" y="0" width="280" height="260" rx="16" fill="url(#sulfurPcb)" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Corner Mounting Holes -->
    <circle cx="18" cy="18" r="8" fill="#140D05" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="262" cy="18" r="8" fill="#140D05" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="18" cy="242" r="8" fill="#140D05" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="262" cy="242" r="8" fill="#140D05" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- SilkScreen Text -->
    <text x="140" y="32" fill="#FFFFFF" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle">SENSOR GAS SULFUR (H2S)</text>
    <text x="140" y="48" fill="#FDE68A" font-size="10" font-family="sans-serif" text-anchor="middle">Food Spoilage Sulfur Gas Detection</text>

    <!-- Metal Mesh Sensor Element -->
    <g transform="translate(140, 130)">
      <circle cx="0" cy="0" r="54" fill="url(#meshSulfur)" stroke="#D97706" stroke-width="3"/>
      <circle cx="0" cy="0" r="46" fill="#FEF3C7"/>
      <circle cx="0" cy="0" r="44" fill="url(#sulfurGrid)"/>
      <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#1C1917" fill-opacity="0.85"/>
      <text x="0" y="4" fill="#FBBF24" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">SULFUR</text>
    </g>

    <!-- Trimpot -->
    <rect x="25" y="105" width="45" height="50" rx="4" fill="#B45309" stroke="#FBBF24" stroke-width="1.5"/>
    <circle cx="47" cy="130" r="14" fill="#FDE68A"/>
    <line x1="40" y1="130" x2="54" y2="130" stroke="#78350F" stroke-width="2.5"/>

    <!-- IC -->
    <rect x="210" y="105" width="45" height="50" rx="3" fill="#1C1917" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="218" cy="115" r="2.5" fill="#A8A29E"/>
    <text x="232" y="134" fill="#D6D3D1" font-size="8" font-family="monospace" text-anchor="middle">LM393</text>

    <!-- Header Pins -->
    <g transform="translate(85, 215)">
      <rect x="0" y="0" width="110" height="26" rx="4" fill="#1C1917" stroke="#78350F" stroke-width="1.5"/>
      <circle cx="16" cy="13" r="4" fill="#FBBF24"/>
      <circle cx="42" cy="13" r="4" fill="#FBBF24"/>
      <circle cx="68" cy="13" r="4" fill="#FBBF24"/>
      <circle cx="94" cy="13" r="4" fill="#FBBF24"/>
      <text x="16" y="38" fill="#FBBF24" font-size="9" font-family="monospace" text-anchor="middle">VCC</text>
      <text x="42" y="38" fill="#A8A29E" font-size="9" font-family="monospace" text-anchor="middle">GND</text>
      <text x="68" y="38" fill="#F59E0B" font-size="9" font-family="monospace" text-anchor="middle">DO</text>
      <text x="94" y="38" fill="#72D94C" font-size="9" font-family="monospace" text-anchor="middle">AO</text>
    </g>
  </g>

  <!-- Right Details -->
  <g transform="translate(420, 100)">
    <g transform="translate(0, 30)">
      <circle cx="50" cy="20" r="16" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="50" y="25" fill="#F59E0B" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">H2S</text>

      <circle cx="110" cy="40" r="14" fill="#72D94C" fill-opacity="0.2" stroke="#72D94C" stroke-width="1.5"/>
      <text x="110" y="44" fill="#72D94C" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">R-SH</text>

      <text x="160" y="25" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">Indikator Tingkat Basi Pangan</text>
      <text x="160" y="45" fill="#D6D3D1" font-size="12" font-family="sans-serif">Mendeteksi senyawa sulfur dari dekomposisi protein</text>
    </g>

    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="320" height="60" rx="12" fill="#1C1917" stroke="#78350F" stroke-width="1"/>
      <text x="16" y="25" fill="#F59E0B" font-size="13" font-weight="bold" font-family="sans-serif">Korelasi Langsung dengan Kebusukan</text>
      <text x="16" y="45" fill="#E7E5E4" font-size="11" font-family="sans-serif">Peningkatan sulfur menandakan pembusukan aktif</text>
    </g>

    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="320" height="60" rx="12" fill="#1C1917" stroke="#78350F" stroke-width="1"/>
      <text x="16" y="25" fill="#72D94C" font-size="13" font-weight="bold" font-family="sans-serif">Fitur Kunci Model AI Random Forest</text>
      <text x="16" y="45" fill="#E7E5E4" font-size="11" font-family="sans-serif">Diproses bersama pH dan VOC untuk klasifikasi akurat</text>
    </g>
  </g>

  <!-- Top Left Badge -->
  <rect x="45" y="45" width="340" height="42" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="65" y="72" fill="#F59E0B" font-size="16" font-weight="900" font-family="sans-serif">SENSOR GAS SULFUR (H2S / BELERANG)</text>

  <!-- Footer Specs -->
  <rect x="45" y="415" width="710" height="45" rx="10" fill="#140D05" stroke="#F59E0B" stroke-opacity="0.3"/>
  <text x="65" y="442" fill="#FEF3C7" font-size="12" font-family="sans-serif">
    <tspan font-weight="bold" fill="#F59E0B">Peran:</tspan> Deteksi Gas Hidrogen Sulfida (H2S) | Sinyal Analog (AO) ke ESP32-S3 | Fitur Utama Penentu Skor Pembusukan Makanan
  </text>
</svg>
