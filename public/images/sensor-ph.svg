<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143D24"/>
      <stop offset="100%" stop-color="#0B2315"/>
    </linearGradient>
    <linearGradient id="probeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A3B30"/>
      <stop offset="50%" stop-color="#4B6353"/>
      <stop offset="100%" stop-color="#1D2A22"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72D94C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3FA81B" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4728"/>
      <stop offset="100%" stop-color="#112B18"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="760" height="460" rx="20" fill="none" stroke="#72D94C" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Technical Grid lines -->
  <path d="M 50 100 H 750 M 50 200 H 750 M 50 300 H 750 M 50 400 H 750" stroke="#72D94C" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 200 50 V 450 M 400 50 V 450 M 600 50 V 450" stroke="#72D94C" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Left: Conditioning Board (Module Signal Converter) -->
  <g transform="translate(80, 140)">
    <!-- Board Base -->
    <rect x="0" y="0" width="220" height="220" rx="14" fill="url(#pcbGrad)" stroke="#72D94C" stroke-width="2"/>
    
    <!-- Mounting Holes -->
    <circle cx="16" cy="16" r="6" fill="#143D24" stroke="#72D94C" stroke-width="1.5"/>
    <circle cx="204" cy="16" r="6" fill="#143D24" stroke="#72D94C" stroke-width="1.5"/>
    <circle cx="16" cy="204" r="6" fill="#143D24" stroke="#72D94C" stroke-width="1.5"/>
    <circle cx="204" cy="204" r="6" fill="#143D24" stroke="#72D94C" stroke-width="1.5"/>

    <!-- BNC Metal Socket -->
    <circle cx="110" cy="50" r="32" fill="#88998D" stroke="#AEC0B4" stroke-width="3"/>
    <circle cx="110" cy="50" r="22" fill="#425046"/>
    <circle cx="110" cy="50" r="8" fill="#F4D03F"/>

    <!-- Blue Potentiometer (Trimpot Calibration) -->
    <rect x="130" y="120" width="55" height="45" rx="5" fill="#1E5FA8" stroke="#3A7FD5" stroke-width="1.5"/>
    <circle cx="157" cy="142" r="12" fill="#EAEAEA"/>
    <line x1="150" y1="142" x2="164" y2="142" stroke="#666" stroke-width="2"/>

    <!-- Op-Amp IC -->
    <rect x="40" y="115" width="50" height="55" rx="3" fill="#1A1A1A" stroke="#444" stroke-width="1.5"/>
    <circle cx="50" cy="125" r="3" fill="#666"/>
    <text x="65" y="146" fill="#AAA" font-size="9" font-family="monospace" text-anchor="middle">TL081</text>

    <!-- Pins header -->
    <rect x="25" y="185" width="70" height="18" fill="#222" rx="3"/>
    <circle cx="36" cy="194" r="3" fill="#F4D03F"/>
    <circle cx="48" cy="194" r="3" fill="#F4D03F"/>
    <circle cx="60" cy="194" r="3" fill="#F4D03F"/>
    <circle cx="72" cy="194" r="3" fill="#F4D03F"/>
    <circle cx="84" cy="194" r="3" fill="#F4D03F"/>

    <!-- Label Board -->
    <text x="110" y="98" fill="#72D94C" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">MODUL SENSOR pH</text>
    <text x="110" y="110" fill="#EAF8E3" font-size="9" opacity="0.8" font-family="monospace" text-anchor="middle">VCC | GND | Po | Do</text>
  </g>

  <!-- Cable from Board to Probe -->
  <path d="M 190 190 Q 340 100 460 210" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round"/>
  <path d="M 190 190 Q 340 100 460 210" fill="none" stroke="#444" stroke-width="4" stroke-linecap="round"/>

  <!-- Right: Glass Electrode pH Probe -->
  <g transform="translate(480, 80)">
    <!-- Probe Top Cap & Cable Entry -->
    <rect x="65" y="20" width="30" height="40" rx="4" fill="#1E2A22" stroke="#72D94C" stroke-width="1.5"/>
    
    <!-- Main Probe Body Cylindrical -->
    <rect x="60" y="60" width="40" height="230" rx="6" fill="url(#probeGrad)" stroke="#111" stroke-width="2"/>
    <line x1="72" y1="65" x2="72" y2="285" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

    <!-- Reference Solution Glass Bulb (Bottom) -->
    <path d="M 60 290 C 60 340 100 340 100 290 Z" fill="url(#glassGrad)" stroke="#72D94C" stroke-width="2.5"/>
    <ellipse cx="80" cy="305" rx="14" ry="16" fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- Electrode Internal Core Wire -->
    <line x1="80" y1="40" x2="80" y2="310" stroke="#C5A059" stroke-width="2.5"/>

    <!-- Labels & Callouts -->
    <g transform="translate(130, 150)">
      <line x1="-20" y1="0" x2="40" y2="0" stroke="#72D94C" stroke-width="1.5"/>
      <circle cx="-20" cy="0" r="4" fill="#72D94C"/>
      <text x="50" y="5" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">Batang Probe pH</text>
      <text x="50" y="24" fill="#AEC0B4" font-size="11" font-family="sans-serif">Elektroda kaca pengukur ion H+</text>
    </g>

    <g transform="translate(130, 295)">
      <line x1="-20" y1="0" x2="40" y2="0" stroke="#72D94C" stroke-width="1.5"/>
      <circle cx="-20" cy="0" r="4" fill="#72D94C"/>
      <text x="50" y="5" fill="#72D94C" font-size="14" font-weight="bold" font-family="sans-serif">Ujung Bola Kaca Sensor</text>
      <text x="50" y="24" fill="#AEC0B4" font-size="11" font-family="sans-serif">Mendeteksi keasaman cairan/makanan</text>
    </g>
  </g>

  <!-- Title Badge Top Left -->
  <rect x="45" y="45" width="310" height="42" rx="12" fill="#72D94C" fill-opacity="0.15" stroke="#72D94C" stroke-width="1.5"/>
  <text x="65" y="72" fill="#72D94C" font-size="16" font-weight="900" font-family="sans-serif">PROBE &amp; MODUL SENSOR pH</text>

  <!-- Technical Spec Footer -->
  <rect x="45" y="415" width="710" height="45" rx="10" fill="#0D2114" stroke="#72D94C" stroke-opacity="0.3"/>
  <text x="65" y="442" fill="#EAF8E3" font-size="12" font-family="sans-serif">
    <tspan font-weight="bold" fill="#72D94C">Spesifikasi:</tspan> Rentang Ukur: pH 0.0 - 14.0 | Suhu Operasional: 0 - 60°C | Output Tegangan: Analog 0 - 3.3V (Kompatibel ESP32-S3)
  </text>
</svg>
